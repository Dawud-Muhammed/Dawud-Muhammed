name: Update profile ring

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/update_profile.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-ring
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution artwork
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: Dawud-Muhammed
        run: python3 scripts/update_profile.py
      - name: Commit updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            echo 'Artwork is already current.'
          else
            git commit -m 'chore: refresh profile contribution ring'
            git pull --rebase
            git push
          fi
